<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAS Advocacia</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f4f4f4;
}

header{
    background:#0f172a;
    color:white;
    text-align:center;
    padding:60px 20px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.btn{
    display:inline-block;
    background:#25D366;
    color:white;
    text-decoration:none;
    padding:12px 20px;
    border-radius:8px;
    font-weight:bold;
}

footer{
    background:#0f172a;
    color:white;
    text-align:center;
    padding:20px;
}
</style>

</head>
<body>

<header>
    <h1>AAS ADVOCACIA</h1>
    <p>Compromisso, ética e excelência na defesa dos seus direitos.</p>
</header>

<div class="container">

    <div class="card">
        <h2>Áreas de Atuação</h2>
        <ul>
            <li>Direito Criminal</li>
            <li>Direito de Família</li>
            <li>Direito do Consumidor</li>
        </ul>
    </div>

    <div class="card">
        <h2>Atendimento</h2>
        <p>Atendimento presencial e online.</p>
        <a class="btn" href="#">Fale pelo WhatsApp</a>
    </div>

</div>

<footer>
    © 2026 AAS Advocacia
</footer>

</body>
</html>
